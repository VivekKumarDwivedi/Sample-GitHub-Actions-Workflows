name: "hello world workflow"

# Controls when the action will run. Triggers the workflow on push done to VD and production branch
on:
    push:
        branches:
            - VD
            - production

jobs:
    hello_world:
        runs-on: ubuntu-latest
        steps:
            - name: "Print hello world"
              run: echo "hello world"

            - name: "Print current date"
              run: date